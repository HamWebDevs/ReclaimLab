name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: reclaimlab --help
      - run: reclaimlab doctor
        if: runner.os != 'macOS'
      - run: reclaimlab demo --output reclaimlab-demo.html
        working-directory: ${{ runner.temp }}
      - run: reclaimlab study-demo --directory synthetic-study --output reclaimlab-study.html
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ runner.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/reclaimlab-demo.html
            ${{ runner.temp }}/reclaimlab-study.html
  devpocket-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HamWebDevs/DevPocket
          ref: 40534a3ec02838c21ffb350c070392d06a6a5dbc
          path: .integration-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ./.integration-host
      - run: python examples/verify_devpocket.py
