name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: reclaimlab --help
      - run: reclaimlab doctor
        if: runner.os != 'macOS'
      - run: reclaimlab demo --output reclaimlab-demo.html
        working-directory: ${{ runner.temp }}
      - run: reclaimlab study-demo --directory synthetic-study --output reclaimlab-study.html
        working-directory: ${{ runner.temp }}
      - run: reclaimlab har-demo --output reclaimlab-network.html
        working-directory: ${{ runner.temp }}
      - run: reclaimlab network-study-demo --directory synthetic-network-study --output reclaimlab-network-study.html
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ runner.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/reclaimlab-demo.html
            ${{ runner.temp }}/reclaimlab-study.html
            ${{ runner.temp }}/reclaimlab-network.html
            ${{ runner.temp }}/reclaimlab-network-study.html
  browser-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python examples/verify_network_report.py --output-directory network-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-network-preview
          path: network-preview
  devpocket-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HamWebDevs/DevPocket
          ref: a667465b0af375cf6336da58f589d874bd070891
          path: .integration-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ./.integration-host
      - run: python examples/verify_devpocket.py
