[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaimlab-toolkit"
version = "0.1.0"
description = "Record laptop slowdowns, inspect evidence and compare changes without guessing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HamWebDevs"}]
dependencies = []

[project.urls]
Repository = "https://github.com/HamWebDevs/ReclaimLab"
Issues = "https://github.com/HamWebDevs/ReclaimLab/issues"

[project.scripts]
reclaimlab = "reclaimlab.cli:main"

[project.entry-points."devpocket.tools"]
reclaimlab = "reclaimlab.integration:build_tool"

[tool.setuptools.packages.find]
include = ["reclaimlab*"]

[tool.setuptools.package-data]
reclaimlab = ["report_template.html"]
