[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaimlab-toolkit"
version = "1.2.0"
description = "Local performance evidence for laptop traces, browser networks and repeatable experiments."
readme = "README.md"
keywords = ["performance-analysis", "har", "web-performance", "offline-reports", "performance-testing", "developer-tools"]
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HamWebDevs"}]
dependencies = []

[project.urls]
Repository = "https://github.com/HamWebDevs/ReclaimLab"
Issues = "https://github.com/HamWebDevs/ReclaimLab/issues"

[project.scripts]
reclaimlab = "reclaimlab.cli:main"

[project.entry-points."devpocket.tools"]
reclaimlab = "reclaimlab.integration:build_tool"
reclaimlab-study = "reclaimlab.integration:build_study_tool"
reclaimlab-har = "reclaimlab.integration:build_har_tool"
reclaimlab-network-study = "reclaimlab.integration:build_network_study_tool"
reclaimlab-bundle = "reclaimlab.integration:build_bundle_tool"
reclaimlab-har-compare = "reclaimlab.integration:build_har_compare_tool"
reclaimlab-har-assets = "reclaimlab.integration:build_har_assets_tool"

[tool.setuptools.packages.find]
include = ["reclaimlab*"]

[tool.setuptools.package-data]
reclaimlab = ["report_template.html", "study_template.html", "network_template.html", "network_study_template.html", "network_compare_template.html"]
